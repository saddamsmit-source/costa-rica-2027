name: fetch-photo-candidates
on:
  workflow_dispatch:
  push:
    branches: [main, redesign]
    paths: ['tools/hotel_queries.json','tools/hero_titles.json']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - run: if git diff --name-only HEAD~1 | grep -q hero_titles; then python3 tools/fetch_titles.py; else QFILE=tools/hotel_queries.json python3 tools/fetch_photos.py; fi
      - run: |
          git config user.name "photo-bot"; git config user.email "photo-bot@users.noreply.github.com"
          git checkout --orphan photo-candidates
          git rm -rq --cached .
          git add cand
          git commit -qm "photo candidates"
          git push -f origin photo-candidates

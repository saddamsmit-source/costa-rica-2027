name: regressietest
on:
  push:
    branches: [main]
    paths-ignore: ['tools/**']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tests/smoke.js

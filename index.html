function v47Region(d){if(d.id===21)return 'Tárcoles';const p=(d.place||'').toLowerCase();if(p.includes('manuel'))return 'Manuel Antonio';return v43place(d.place)}
function v47Info(name){const s=V47_SP[name];return s?{en:name,nl:s[0],cat:s[1],moment:s[2],tip:s[3]}:{en:name,nl:name,cat:'Zelf toegevoegd',moment:'',tip:''}}
function v47Chance(region,name){const r=(V47_PLACES[region]||[]).find(x=>x[0]===name);return r?r[1]:0}
function v47Obs(name,region){const o=state.v43Observations[v43name(name)];return {here:o?.places?.[region]||{},other:Object.entries(o?.places||{}).filter(([p,v])=>p!==region&&(v.seen||v.photo)).map(([p])=>p)}}
function v47Svg(inner,size){return `<svg viewBox="0 0 24 24" width="${size||20}" height="${size||20}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`}

function v47Card(name,region,focus){
  const i=v47Info(name),ch=v47Chance(region,name)||(focus?2:0),o=v47Obs(name,region),seen=!!o.here.seen,photo=!!o.here.photo,m=V47_MOMENT[i.moment];
  const enc=encodeURIComponent(name),pl=encodeURIComponent(region);
  return `<div class="v43-species v47-sp ${seen?'is-seen':''}" data-v47-cat="${esc(i.cat)}">
    <div class="v47-top">
      <div class="v47-ico cat-${esc(i.cat).toLowerCase().replace(/[^a-z]/g,'')}">${v47Svg(V47_CAT_ICON[i.cat]||V46_ICONS.pin,24)}</div>
      <div class="v47-names"><strong>${esc(i.nl)}</strong>${i.nl!==i.en?`<em>${esc(i.en)}</em>`:''}</div>
      ${ch?`<span class="v47-chance ${V47_CHANCE[ch][1]}">${V47_CHANCE[ch][0]}</span>`:''}
    </div>
    <div class="v47-meta">${m?`<span class="v47-moment">${v47Svg(m[1],14)}${m[0]}</span>`:''}${o.other.length?`<span class="v47-prev">✓ Eerder gezien: ${esc(o.other.join(', '))}</span>`:''}</div>
    ${i.tip?`<div class="v47-tip">${esc(i.tip)}</div>`:''}
    <div class="v43-buttons">
      <button class="${seen?'on':''}" data-v43-species="${enc}" data-v43-kind="seen" data-v43-place="${pl}">${v47Svg('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',16)} ${seen?'Gezien':'Gezien?'}</button>
      <button class="${photo?'on':''}" data-v43-species="${enc}" data-v43-kind="photo" data-v43-place="${pl}">${v47Svg(V46_ICONS.camera,16)} ${photo?'Op foto':'Foto?'}</button>
    </div></div>`}

function v47RegionNames(d){
  const region=v47Region(d),base=(V47_PLACES[region]||[]).map(x=>x[0]);
  const extras=[...new Set([...(state.v43Extras[region]||[]),...(state.v43Extras[v43place(d.place)]||[])])];
  return {region,base,extras};
}

speciesList=function(d){
  const {region,base,extras}=v47RegionNames(d),focusDef=V47_FOCUS[d.id],focus=focusDef?focusDef.list:[];
  const rest=base.filter(n=>!focus.includes(n)).sort((a,b)=>v47Chance(region,b)-v47Chance(region,a));
  const all=[...new Set([...focus,...base,...extras])];
  const seenHere=all.filter(n=>v47Obs(n,region).here.seen).length,photoHere=all.filter(n=>v47Obs(n,region).here.photo).length,st=v43Stats();
  const cats=['Alle',...new Set(all.map(n=>v47Info(n).cat)),'Nog niet gezien'];
  const pass=n=>v47Filter==='Alle'||(v47Filter==='Nog niet gezien'?!v47Obs(n,region).here.seen&&!v47Obs(n,region).other.length:v47Info(n).cat===v47Filter);
  const byCat={};rest.filter(pass).forEach(n=>{(byCat[v47Info(n).cat]??=[]).push(n)});
  const order=['Vogels','Zoogdieren','Reptielen','Amfibieën','Zeeleven','Insecten'];
  const focusShown=focus.filter(pass),extrasShown=extras.filter(n=>!focus.includes(n)&&!base.includes(n)).filter(pass);
  if(!all.length)return `<div class="card"><div class="v46-h">${v47Svg(V47_CAT_ICON.Vogels,20)}Wildlife</div><p class="hint">Reisdag zonder wildlife-focus.</p></div>`;
  return `
  <div class="card v47-head">
    <div class="v46-h">${v47Svg(V47_CAT_ICON.Vogels,20)}Wildlife · ${esc(region)}</div>
    <div class="v46-stats">
      <div class="v46-stat"><b>${all.length}</b><span>doelsoorten</span></div>
      <div class="v46-stat"><b>${seenHere}</b><span>gezien hier</span></div>
      <div class="v46-stat"><b>${photoHere}</b><span>op foto hier</span></div>
      <div class="v46-stat"><b>${st.seen}</b><span>reis totaal</span></div>
    </div>
    <div class="v47-filter">${cats.map(c=>`<button data-v47-filter="${esc(c)}" class="${v47Filter===c?'on':''}">${esc(c)}</button>`).join('')}</div>
  </div>
  ${focusShown.length?`<div class="card v47-focus"><div class="v47-focus-h"><span>Focus vandaag</span><small>${esc(focusDef.label)}</small></div>${focusShown.map(n=>v47Card(n,region,true)).join('')}</div>`:''}
  ${Object.keys(byCat).length||extrasShown.length?`<div class="card"><div class="v47-focus-h"><span>Meer in deze regio</span><small>Gesorteerd op kans</small></div>
    ${order.filter(c=>byCat[c]).map(c=>`<h4 class="v47-cat-h">${esc(c)} · ${byCat[c].length}</h4>${byCat[c].map(n=>v47Card(n,region,false)).join('')}`).join('')}
    ${extrasShown.length?`<h4 class="v47-cat-h">Zelf toegevoegd · ${extrasShown.length}</h4>${extrasShown.map(n=>v47Card(n,region,false)).join('')}`:''}
  </div>`:''}
  ${!focusShown.length&&!Object.keys(byCat).length&&!extrasShown.length?'<div class="card"><p class="hint">Niets in dit filter.</p></div>':''}
  <div class="card"><div class="v43-add"><input id="v43NewSpecies" maxlength="90" placeholder="Eigen waarneming toevoegen" aria-label="Nieuwe soort"><button id="v43AddSpecies">+ Toevoegen</button></div>
  <p class="hint" style="margin:10px 0 0">Kansen zijn een inschatting voor februari–maart met gids, geen garantie. Gebruik Merlin Bird ID voor determinatie op geluid.</p></div>`;
};

/* tellers en reisbrede lijsten laten aansluiten op de nieuwe data */
v46SpeciesCount=function(d){const {base,extras}=v47RegionNames(d),f=(V47_FOCUS[d.id]||{}).list||[];return new Set([...f,...base,...extras]).size};
(function(){
  for(const k of Object.keys(V43_TARGETS))delete V43_TARGETS[k];
  for(const [region,list] of Object.entries(V47_PLACES)){const g={};list.forEach(([n])=>{(g[v47Info(n).cat]??=[]).push(n)});V43_TARGETS[region]=g}
  for(const d of S){const f=V47_FOCUS[d.id];if(f)d.wildlife=f.list.map(n=>v47Info(n).nl)}
})();

const v47PrevBind=bindExtras;
bindExtras=function(){
  v47PrevBind();
  document.querySelectorAll('[data-v47-filter]').forEach(b=>b.onclick=()=>{v47Filter=b.dataset.v47Filter;render()});
  const add=document.getElementById('v43AddSpecies');
  if(add&&tab==='days'&&daySection==='wildlife')add.onclick=()=>{const input=document.getElementById('v43NewSpecies'),name=input.value.trim(),d=S[currentDay-1],region=v47Region(d);if(!name)return;state.v43Extras[region]??=[];const {base,extras}=v47RegionNames(d);if(![...base,...extras].some(n=>v43name(n)===v43name(name)))state.v43Extras[region].push(name);save();render()};
};
const v47PrevDayMove=dayMove;
dayMove=function(n){v47Filter='Alle';v47PrevDayMove(n)};

/* ---------- v4.8 UI ---------- */
const V48_START='2027-02-08',V48_END='2027-03-02';
function v48Today(){const t=new Date(),iso=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');return iso}
function v48TripDay(){const iso=v48Today();const i=S.findIndex(d=>d.date===iso);return i>=0?i+1:0}
function v48DaysToGo(){const a=new Date(V48_START+'T00:00:00'),b=new Date(v48Today()+'T00:00:00');return Math.round((a-b)/864e5)}
function v48Photo(key){return key&&V48_PHOTO[key]?'./photos/'+key+'.jpg':''}
function v48DayKey(d){if(d.id===22)return V48_REGION_PHOTO['vertrek'];if(d.id===23)return V48_REGION_PHOTO['Amsterdam'];return V48_REGION_PHOTO[v47Region(d)]}
function v48ActKey(a,d){return V48_ACT_PHOTO_DAY[d.id+'|'+a.title]||V48_ACT_PHOTO[a.title]||v48DayKey(d)}

/* bestemmingsfoto's lokaal */
locationPhoto=function(d){return v48Photo(v48DayKey(d))||'hero-jungle.jpg'};
photoBackground=function(d){return `linear-gradient(180deg,rgba(2,26,20,.10) 0%,rgba(3,28,23,.20) 40%,rgba(2,22,19,.90) 100%),url('${locationPhoto(d)}')`};

(function(){state.v48Init??=false;if(!state.v48Init){S.forEach(d=>d.activities.forEach((a,i)=>{if(V48_ACT[a.title]?.book==='geboekt'&&!state.bookings[d.id+'-'+i])state.bookings[d.id+'-'+i]='geboekt'}));state.v48Init=true;save()}})();
function v48BookOf(a,d,i){const s=state.bookings[d.id+'-'+i];if(s==='geboekt')return 'geboekt';return (V48_ACT[a.title]||{}).book||''}

/* activiteitkaart met echte foto */
visualActivity=function(a){
  const day=S.find(d=>d.activities.includes(a))||S[currentDay-1],idx=day.activities.indexOf(a),group=statusGroup(a),info=V48_ACT[a.title]||{},bk=v48BookOf(a,day,idx),src=v48Photo(v48ActKey(a,day));
  const chips=[info.price,info.dur].filter(Boolean).map(x=>`<span class="v48-chip">${esc(x)}</span>`).join('');
  return `<div class="v46-act v48-act ${group} ${a.status==='excluded'?'excluded':''}" role="button" tabindex="0" data-activity="${idx}" data-day="${day.id}">
    <div class="v48-thumb">${src?`<img src="${src}" alt="${esc(a.title)}" loading="lazy">`:''}<span class="v48-badge">${v46Icon(v46IconKey(a.title),15)}</span></div>
    <div class="v46-copy"><div class="actname">${esc(a.title)}</div>
      <div class="acttags">${pill(sourceName[a.source],a.source)}${pill(statusName[a.status],a.status)}${bk&&V48_BOOK[bk]?`<span class="v48-book ${V48_BOOK[bk][1]}">${V48_BOOK[bk][0]}</span>`:''}</div>
      ${chips?`<div class="v48-chips">${chips}</div>`:''}
      ${a.note?`<div class="note">${esc(a.note)}</div>`:''}</div>
    <span class="v46-chev" aria-hidden="true">›</span></div>`};

/* hotelkaart */
function v48HotelCard(h,d,n){
  const x=V48_HOTEL[h]||{},src=v48Photo(V48_REGION_PHOTO[v43place(d.place)])||locationPhoto(d),q=encodeURIComponent(h+' '+(d.place.split('/')[0]).trim()+' Costa Rica');
  const label=x.std?'Standaard voor 2 personen':x.single?'Alleen voor singlereizigers':n>1?'Een van de Sawadee-opties':'Sawadee-accommodatie';
  return `<div class="v48-hotel ${x.single?'single':''}">
    <img src="${src}" alt="" loading="lazy">
    <div class="v48-hotel-body"><strong>${esc(h)}</strong><small>${label}</small>
      ${x.d?`<p>${esc(x.d)}</p>`:''}
      ${x.f?`<div class="v48-fac">${x.f.map(f=>`<span>${esc(f)}</span>`).join('')}</div>`:''}
      ${x.warn?`<div class="v48-warn">${esc(x.warn)}</div>`:''}
      <a class="v48-link" href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">Bekijk hotel ↗</a>
    </div></div>`}

/* dagoverzicht: hotelblok (aangeroepen vanuit v4.6-overzicht) */
function v48HotelsBlock(d){
  if(!d.hotel.length)return '<p class="hint">Geen overnachting gepland.</p>';
  const note=d.hotel.some(h=>V48_HOTEL[h]?.single)?'<p class="hint" style="margin:8px 0 0">Met z\'n tweeën slapen jullie in de standaard-lodge; de andere opties zijn voor singlereizigers.</p>':d.hotel.length>1?'<p class="hint" style="margin:8px 0 0">Voorlopige alternatieven; Sawadee bevestigt het hotel kort voor vertrek.</p>':'';
  return d.hotel.map(h=>v48HotelCard(h,d,d.hotel.length)).join('')+note}

const v48PrevRenderBookings=renderBookings;
renderBookings=function(){

  return `<div class="card"><div class="v46-h">${v46Icon('pin',20)}Te regelen en te betalen</div>

  <div class="card"><div class="v46-h">${v46Icon('camera',20)}Paklijst <span class="v48-count-inline">${done}/${total}</span></div>${pack}</div>`+v48PrevRenderBookings()};

function v50Timeline(d){
  const order={Ochtend:0,undefined:1,Middag:2,Avond:3};
  const acts=d.activities.map((a,i)=>({a,i})).filter(x=>x.a.status!=='excluded').sort((x,y)=>(order[V50_SLOT[x.a.title]]??1)-(order[V50_SLOT[y.a.title]]??1)||x.i-y.i);
  return acts.map(({a,i})=>{const k=v50Kind(a),info=V48_ACT[a.title]||{},slot=V50_SLOT[a.title];
    const sub=[info.dur,info.price].filter(Boolean).join(' · ')||a.note||'';
    return `<div class="v50-tl" data-activity="${i}" data-day="${d.id}" role="button" tabindex="0">
      <div class="v50-tl-ico ${V50_KIND[k][1]}">${v46Icon(v46IconKey(a.title),18)}</div>
      <div class="v50-tl-body">${slot?`<small>${slot}</small>`:''}<b>${esc(a.title)}</b>${sub?`<span>${esc(sub)}</span>`:''}</div>
      <span class="v50-pill ${V50_KIND[k][1]}">${V50_KIND[k][0]}</span></div>`}).join('')||'<p class="hint">Geen activiteiten op deze dag.</p>';
}
function v50Know(d){
  const out=[];if(d.flag)out.push(['alert',d.flag]);
  d.activities.forEach(a=>{const x=V48_ACT[a.title];if(x?.book==='online')out.push(['alert',`${a.title}: tickets vooraf online via SINAC.`])});
  if([4,5].includes(d.id))out.push(['coin','Maaltijden in Tortuguero: vast bedrag voor drie maaltijden per dag, ter plekke te betalen.']);
  if([16,17,18].includes(d.id))out.push(['coin','Maaltijden in Corcovado: vast bedrag per dag, ter plekke te betalen. De Corcovado-excursie betaal je aan de lodge.']);
  if(d.id===16)out.push(['info','Waterschoenen aan: je waadt aan land. Neem een kleine tas mee voor 3 nachten.']);
  if([10,11,12,13].includes(d.id))out.push(['info','Neem een warme laag mee: de nachten in het nevelwoud en de bergen kunnen koud zijn.']);
  if(d.tip)out.push(['info',d.tip]);
  return out.length?`<div class="v50-know"><div class="v50-know-h">${v50I('info',18)}Goed om te weten</div><ul>${out.map(([i,t])=>`<li>${v50I(i,15)}<span>${esc(t)}</span></li>`).join('')}</ul></div>`:'';
}
const v50PrevDayContent=dayContent;
dayContent=function(d){
  if(daySection==='overview'){

    return `<div class="card v50-card"><div class="v50-h">Dagoverzicht</div><p class="v50-text">${esc(V50_TEXT[d.id]||d.base)}</p>
      <div class="v50-timeline">${v50Timeline(d)}</div></div>

      ${v50Know(d)}
      <details class="v49-acc v50-notes" ${state.notes[d.id]?'open':''}><summary><span>${v50I('note',16)} Mijn notities</span>${state.notes[d.id]?'<em>✓</em>':''}</summary><textarea class="field" data-note="${d.id}" placeholder="Waarnemingen, tijden, fotomomenten…">${esc(state.notes[d.id]||'')}</textarea></details>`;
  }
  if(daySection==='activities'){
    const by={saw:[],own:[],opt:[],excl:[]};d.activities.forEach(a=>by[v50Kind(a)].push(a));
    const sec=(k,t,ic)=>by[k].length?`<div class="v50-sec ${V50_KIND[k][1]}"><h3>${v50I(ic,18)}${t}</h3>${by[k].map(visualActivity).join('')}</div>`:'';
    return sec('saw','Sawadee-programma','leaf')+sec('own','Onze toevoegingen','star')+sec('opt','Optionele activiteiten','plus')+sec('excl','Bewust uitgesloten','info')||'<div class="card"><p class="hint">Geen activiteiten.</p></div>';
  }
  if(daySection==='stay'){
    if(!d.hotel.length)return '<div class="card"><p class="hint">Geen overnachting op deze dag.</p></div>';
    const two=d.hotel.some(h=>V48_HOTEL[h]?.single);

  }
  return v50PrevDayContent(d);
};

function v50Sanitize(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const keep=/[←→↗›‹·–—✓]/;while((n=w.nextNode())){if(n.parentElement&&/^(SCRIPT|STYLE|TEXTAREA|INPUT|OPTION)$/.test(n.parentElement.tagName))continue;const t=n.nodeValue;if(!V50_EMOJI.test(t))continue;V50_EMOJI.lastIndex=0;n.nodeValue=t.replace(V50_EMOJI,m=>keep.test(m)?m:'').replace(/^\s+/,m=>m.includes('\n')?m:' ').replace(/\s{2,}/g,' ')}}

  const exc=Object.entries(V51_EXC).flatMap(([d,list])=>list.map(n=>{const[x,y]=P(n),on=+d===focusDay;return `<g class="v51-exc ${on?'on':''}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${on?7:5}"/>${on?`<text x="${(x+10).toFixed(1)}" y="${(y+4).toFixed(1)}">${esc(V51_PT[n][2])}</text>`:''}</g>`})).join('');
  const sjo=P('SJO');
  const me=v51Pos?(()=>{const[x,y]=v51XY(v51Pos.lat,v51Pos.lon);return x>-20&&x<M.W+20&&y>-20&&y<M.H+20?`<g class="v51-me"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="16" class="pulse"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7"/></g>`:''})():'';
  return `<svg class="v51-svg" viewBox="0 0 ${M.W} ${M.H}" role="img" aria-label="Routekaart Costa Rica">
    <rect width="${M.W}" height="${M.H}" class="v51-sea"/>
    <path d="${M.NIC}" class="v51-nb"/><path d="${M.PAN}" class="v51-nb"/><path d="${M.CRI}" class="v51-land"/>
    <text x="70" y="40" class="v51-cty">NICARAGUA</text><text x="${M.W-90}" y="${M.H-24}" class="v51-cty">PANAMA</text>
    <text x="${M.W-120}" y="120" class="v51-sea-lbl">Caribische Zee</text><text x="40" y="${M.H-60}" class="v51-sea-lbl">Grote Oceaan</text>
    ${tracks}${legs}<g class="v51-air"><path d="M${(sjo[0]-6).toFixed(1)},${sjo[1].toFixed(1)}h12M${sjo[0].toFixed(1)},${(sjo[1]-6).toFixed(1)}v12"/></g>${exc}${stops}${labels}${me}
  </svg>`}
function v51Legend(){return `<div class="v51-legend"><span><i class="l-road"></i>Bus (hemelsbreed)</span><span><i class="l-boat"></i>Boot</span><span><i class="l-exc"></i>Excursie</span><span><i class="l-me"></i>Jij</span></div>`}
function v51Nav(name,lat,lon){const q=encodeURIComponent(name+', Costa Rica');return `<div class="v51-navbtns"><a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}" target="_blank" rel="noopener">${v50I('pin',15)}Google Maps</a><a href="https://waze.com/ul?ll=${lat},${lon}&navigate=yes" target="_blank" rel="noopener">${v50I('pin',15)}Waze</a><a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">${v50I('list',15)}Zoek plek</a></div>`}
function v51GpsBox(){const s=v51Watch!==null;return `<div class="v51-gps"><button id="v51gps" class="${s?'on':''}">${v50I('pin',16)}${s?'Live positie aan':'Toon mijn positie'}</button><span id="v51gpsinfo">${v51Pos?`${v51Pos.lat.toFixed(4)}, ${v51Pos.lon.toFixed(4)} · ±${Math.round(v51Pos.acc)} m`:'Werkt ook zonder internet (GPS)'}</span></div>`}

/* ---------- reisinformatie per dag ---------- */
function v51Info(d){
  const si=v51Day2Stop(d.id),stop=V51_STOPS[si][0],pt=V51_PT[stop],prev=si>0&&V51_STOPS[si][1][0]===d.id?V51_STOPS[si-1][0]:null;
  const tr=V51_TRAVEL[d.id],km=prev?Math.round(v51Dist(V51_PT[prev],pt)):null,clim=V51_CLIM[v47Region(d)]||V51_CLIM[stop],sun=v51Sun(pt[0],pt[1],d.date);
  const row=(ic,t,v,s)=>`<div class="v51-row"><span class="v51-ic">${ic}</span><div><b>${t}</b><span>${v}</span>${s?`<small>${s}</small>`:''}</div></div>`;
  const climTxt=!clim?'—':clim.txt?esc(clim.txt):`${String(clim.lo).replace('.',',')}–${String(clim.hi).replace('.',',')} °C · ${String(clim.mm).replace('.',',')} mm${clim.dd!=null?' · '+String(clim.dd).replace('.',',')+' regendagen':''}`;
  return `<div class="card v51-info"><div class="v50-h">Reisinformatie</div>
    ${row(v46Icon(tr?.m==='boat'?'boat':tr?.m==='plane'?'plane':'bus',20),'Reistijd',tr?esc(tr.t):'Geen transfer vandaag',tr?'Volgens Sawadee-reisroute':'')}
    ${km?row(v50I('pin',20),'Afstand (hemelsbreed)',`± ${km} km hemelsbreed vanaf ${esc(V51_PT[prev][2])}`,'Over de weg is het verder'):''}
    ${row(V46_SVG('<path d="m3 20 6-10 4 6 3-4 5 8z"/>').replace('width="24" height="24"','width="20" height="20"'),'Hoogte',esc(V51_ELEV[v47Region(d)]||V51_ELEV[stop]||'—'),'')}
    ${row(v50I('clock',20).replace(V50_I.clock,'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),'Zon op / onder',`${sun.rise} / ${sun.set}`,'Berekend voor '+esc(pt[2])+', lokale tijd')}
    ${row(V46_SVG('<path d="M7 18a5 5 0 1 1 .9-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8z"/><path d="M9 21l1-2M13 21l1-2"/>').replace('width="24" height="24"','width="20" height="20"'),'Klimaat in februari',climTxt,clim?.src?esc(clim.src):'')}
  </div>`}

/* dag-in-het-kort op het overzicht */
function v51Brief(d){const tr=V51_TRAVEL[d.id],fixed=d.activities.filter(a=>v50Kind(a)==='saw'||a.status==='locked').length,opt=d.activities.filter(a=>v50Kind(a)==='opt').length,todo=d.activities.filter((a,i)=>['online','zelf'].includes(v48BookOf(a,d,i))&&a.status!=='excluded').length,sun=v51Sun(V51_PT[V51_STOPS[v51Day2Stop(d.id)][0]][0],V51_PT[V51_STOPS[v51Day2Stop(d.id)][0]][1],d.date);
  const t=(ic,v,l,warn)=>`<div class="v51-tile ${warn?'warn':''}">${ic}<b>${v}</b><small>${l}</small></div>`;
  return `<div class="v51-brief">${t(v46Icon(tr?.m==='boat'?'boat':tr?.m==='plane'?'plane':'bus',18),tr?esc(tr.t.replace(/^ca\. /,'').split(' (')[0].split(':').pop().trim()):'—','reistijd')}${t(v50I('lock',18),fixed,'vast')}${t(v50I('plus',18),opt,'optioneel')}${t(v50I('alert',18),todo,'te regelen',todo>0)}</div><div class="v51-sunline">${v50I('clock',14)}Zon op ${sun.rise} · onder ${sun.set}</div>`}
const v51PrevDC=dayContent;
dayContent=function(d){
  if(daySection==='overview'){return v51PrevDC(d).replace('<div class="v50-timeline">',v51Brief(d)+'<div class="v50-timeline">')}
  if(daySection==='map'){const si=v51Day2Stop(d.id),stop=V51_STOPS[si][0],pt=V51_PT[stop];
    return `<div class="card v51-mapcard"><div class="v51-maphead"><div class="v50-h">Locatie & kaart</div>${v51GpsBox()}</div>${v51Svg(d.id)}${v51Legend()}<p class="hint" style="margin:6px 0 0">Offline kaart. Locaties bij benadering; lijnen hemelsbreed, niet de rijroute.</p></div>
    <div class="card"><div class="v50-h" style="font-size:16px">Navigeer naar ${esc(pt[2])}</div><p class="hint" style="margin:0 0 8px">Vraagt internet. Voor de lodge zelf: zoek op de hotelnaam.</p>${v51Nav(pt[2],pt[0],pt[1])}</div>${v51Info(d)}`}
  return v51PrevDC(d)};

/* hoofdkaart */
renderMap=function(){const td=v48TripDay();
  return `<div class="card v51-mapcard"><div class="v51-maphead"><div class="v50-h">Schematische routekaart</div>${v51GpsBox()}</div>${v51Svg(td||0)}${v51Legend()}<p class="hint" style="margin:6px 0 0">Werkt zonder internet. Tik een genummerde stop om die dag te openen. Je opgenomen GPS-routes verschijnen als groene lijn.</p></div>
  <div class="card"><div class="v50-h">Etappes</div>${V51_STOPS.slice(0,-1).map(([r,days],i)=>{const d0=S[days[0]-1],prev=i?V51_STOPS[i-1][0]:null,km=prev?Math.round(v51Dist(V51_PT[prev],V51_PT[r])):0;return `<button class="v51-leg" data-v51-day="${days[0]}"><span class="v51-n">${i+1}</span><span><b>${esc(V51_PT[r][2])}</b><small>Dag ${days.join(', ')} · ${fmt(d0.date)}${V51_TRAVEL[days[0]]?' · '+esc(V51_TRAVEL[days[0]].t):''}${km?' · ± '+km+' km hemelsbreed':''}</small></span>${v50I('chev',18).replace('<path','<path transform="rotate(-90 12 12)"')}</button>`}).join('')}</div>
  ${gpsPanel()}`};

/* ---------- valuta-omrekenaar ---------- */
state.v51Rates??={eurusd:1.1176,usdcrc:455.47,date:'12 okt 2026'};
function v51Fx(){const r=state.v51Rates;return `<div class="card v51-fx" id="v51fx"><div class="v50-h">${v50I('coin',20)} Valuta omrekenen</div>
  <div class="v51-fxrow"><label>EUR<input type="number" inputmode="decimal" data-v51-cur="eur" value="10"></label><label>USD<input type="number" inputmode="decimal" data-v51-cur="usd"></label><label>CRC<input type="number" inputmode="decimal" data-v51-cur="crc"></label></div>
  <div class="v51-quick">${[1000,5000,10000,20000].map(c=>`<button data-v51-crc="${c}">₡${c.toLocaleString('nl-NL')}</button>`).join('')}${[5,20,50].map(u=>`<button data-v51-usd="${u}">$${u}</button>`).join('')}</div>
  <details class="v51-rates"><summary>Koers: 1 EUR = ${String(r.eurusd).replace('.',',')} USD · 1 USD = ₡${String(r.usdcrc).replace('.',',')} <small>(${esc(r.date)})</small></summary>
  <div class="v51-fxrow"><label>1 EUR in USD<input type="number" step="0.0001" id="v51r1" value="${r.eurusd}"></label><label>1 USD in CRC<input type="number" step="0.01" id="v51r2" value="${r.usdcrc}"></label></div><button class="btn primary" id="v51rsave" style="width:100%;margin-top:8px">Koers opslaan</button>
  <p class="hint">Standaard: koers van 12 okt 2026 (Trading Economics). Werkt offline; pas aan met de koers ter plaatse.</p></details></div>`}
function v51FxCalc(src){const r=state.v51Rates,g=k=>document.querySelector(`[data-v51-cur="${k}"]`);if(!g('eur'))return;let eur;const v=parseFloat(g(src).value);if(isNaN(v)){return}
  eur=src==='eur'?v:src==='usd'?v/r.eurusd:v/r.usdcrc/r.eurusd;
  const f=(x,dg)=>(Math.round(x*10**dg)/10**dg);if(src!=='eur')g('eur').value=f(eur,2);if(src!=='usd')g('usd').value=f(eur*r.eurusd,2);if(src!=='crc')g('crc').value=Math.round(eur*r.eurusd*r.usdcrc)}

/* ---------- back-upstatus ---------- */
function v51BackupAge(){const t=state.v51LastBackup;return t?Math.floor((Date.now()-new Date(t))/864e5):null}
function v51BackupCard(){const a=v51BackupAge(),warn=a===null||a>14;return `<div class="card v51-backup ${warn?'warn':''}">${v50I(warn?'alert':'check',20)}<div><b>${a===null?'Nog geen back-up gemaakt':a===0?'Back-up gemaakt: vandaag':`Laatste back-up: ${a} ${a===1?'dag':'dagen'} geleden`}</b><span>Je notities, afvinklijsten en waarnemingen staan alleen in deze browser. Download regelmatig een back-up${warn?', zeker vóór vertrek':''}.</span></div></div>`}
const v51PrevSettings=renderSettings;
renderSettings=function(){return v51BackupCard()+v51Fx()+v51PrevSettings()};
const v51PrevHome=renderHome;
renderHome=function(){let h=v51PrevHome();const a=v51BackupAge();if(a===null||a>14)h=h.replace('<div class="home-section-title">',`<button class="v51-homewarn" data-goto="settings">${v50I('alert',16)}${a===null?'Nog geen back-up van je gegevens':'Back-up is '+a+' dagen oud'} · maak er nu een</button><div class="home-section-title">`);
  return h.replace(/<strong>Praktisch<\/strong><small>[^<]*<\/small>/,'<strong>Praktisch</strong><small>Valuta, info & back-up</small>')};

/* ---------- fototips prioriteitssoorten ---------- */
const V51_PHOTO={
'Resplendent quetzal':'200–600 mm op 400–600 mm, statief of steun. Vroege ochtend bij wilde avocadobomen; let op lange staartveren in het kader. Meestal tegenlicht: +0,7 tot +1 EV.',
'Keel-billed toucan':'200–600 mm. Zit vaak hoog tegen lucht: belicht +1 EV of zoek een plek met groen als achtergrond.',
'Yellow-throated toucan':'200–600 mm; zelfde aanpak als zwavelborsttoekan. Let op scherpte op het oog, niet op de snavel.',
'Fiery-billed aracari':'200–600 mm; groepjes bewegen snel tussen fruitbomen: 1/1000 s of sneller.',
'Collared aracari':'200–600 mm; 1/1000 s, continu AF bij fruitbomen.',
'Scarlet macaw':'Vluchtfoto\'s: 200–400 mm, 1/2000 s, AF-C met dierherkenning. Paren vliegen laag over bij zonsopkomst.',
'Ringed kingfisher':'200–600 mm vanaf de boot; 1/1600 s voor duikmomenten. Lens niet wisselen op het water.',
'Green kingfisher':'Klein: 600 mm en dichtbij. Zit laag boven water; let op weerspiegeling als achtergrond.',
'American pygmy kingfisher':'Piepklein in donkere kanalen: 600 mm, ISO omhoog (3200–6400), 1/500 s volstaat bij stilzitten.',
'Amazon kingfisher':'200–600 mm vanaf de boot; 1/1600 s.',
'King vulture':'Hoog in de lucht: 600 mm, +1 EV tegen heldere lucht. Middag bij thermiek.',
'Laughing falcon':'Zit lang stil op kale tak: 400–600 mm, werk de compositie rustig uit.',
'Ornate hawk-eagle':'Zeldzaam; houd de camera klaar op 600 mm met snelle sluitertijd.',
'Osprey':'Duikmomenten: 1/2500 s, AF-C. Vanaf rivier of kust.',
'Baird\'s tapir':'Vaak in schaduw bij water: 24–105 mm of 200 mm, hoge ISO. Geen flits, houd afstand.',
'Brown-throated three-toed sloth':'Hoog in cecropia\'s: 400–600 mm, +0,7 EV tegen lucht. Wacht op een gezicht in beeld.',
'Hoffmann\'s two-toed sloth':'Nachtwandeling: met gidslamp, hoge ISO, geen flits recht op de ogen.',
'Red-eyed tree frog':'Nachtwandeling: 24–105 mm op 105 mm dichtbij, zaklamp van opzij; korte afstand, geen aanraking.',
'Humpback whale':'200–400 mm, 1/2000 s, AF-C. Staart en sprongen zijn kort: serie-opnamen. Drybag mee.',
'Three-wattled bellbird':'Volg het geluid; 600 mm, zit hoog op kale takken. Vaak tegenlicht: +1 EV.',
'Turquoise-browed motmot':'Zit stil met slingerende staart: 400–600 mm, 1/500 s, staart volledig in beeld.',
'Boat-billed heron':'Overdag in dichte oevervegetatie: 600 mm, hoge ISO, rustig vanaf de boot.',
'Spectacled caiman':'Ooghoogte vanaf de kano: 200–400 mm, focus op het oog.',
'American crocodile':'Vanaf de brug: 200–600 mm; leg de lens op de reling, niet erover hangen.',
'Fiery-throated hummingbird':'Kleuren alleen in direct licht: positioneer je met de zon in je rug, 1/2000 s of flits-vrij met hoge ISO.',
'Violet sabrewing':'Bij voederplekken: 200–400 mm, 1/2500 s voor vleugels.',
'Central American squirrel monkey':'Snelle groepen op lage hoogte: 200–400 mm, 1/1000 s, AF-C.',
'Mantled howler monkey':'Hoog in de kruin: 400–600 mm, belicht voor de vacht (+0,7 EV).'
};
const v51PrevCard=v47Card;
v47Card=function(name,region,focus){const h=v51PrevCard(name,region,focus),t=V51_PHOTO[name];return t?h.replace('<div class="v43-buttons">',`<div class="v51-ptip">${v50I('camera',15)}<span><b>Fototip</b> ${esc(t)}</span></div><div class="v43-buttons">`):h};

/* ---------- binding ---------- */
function v51StartGps(){if(!navigator.geolocation){alert('GPS niet beschikbaar op dit apparaat');return}
  if(v51Watch!==null){navigator.geolocation.clearWatch(v51Watch);v51Watch=null;render();return}
  v51Watch=navigator.geolocation.watchPosition(p=>{v51Pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};const svg=document.querySelector('.v51-svg');if(svg){const w=document.createElement('div');w.innerHTML=v51Svg(tab==='days'?currentDay:(v48TripDay()||0));svg.replaceWith(w.firstElementChild);v51BindStops()}const i=document.getElementById('v51gpsinfo');if(i)i.textContent=`${v51Pos.lat.toFixed(4)}, ${v51Pos.lon.toFixed(4)} · ±${Math.round(v51Pos.acc)} m`},e=>{alert('Geen GPS-positie: '+e.message);navigator.geolocation.clearWatch(v51Watch);v51Watch=null;render()},{enableHighAccuracy:true,maximumAge:10000,timeout:30000});render()}
function v51BindStops(){document.querySelectorAll('[data-v51-day]').forEach(el=>el.onclick=()=>{currentDay=Number(el.dataset.v51Day);daySection=tab==='days'?'map':'overview';tab='days';render();window.scrollTo({top:0,behavior:'instant'})})}
const v51PrevBind=bindExtras;
bindExtras=function(){v51PrevBind();
  const g=document.getElementById('v51gps');if(g)g.onclick=v51StartGps;v51BindStops();
  document.querySelectorAll('[data-v51-cur]').forEach(i=>i.oninput=()=>v51FxCalc(i.dataset.v51Cur));
  document.querySelectorAll('[data-v51-crc]').forEach(b=>b.onclick=()=>{const i=document.querySelector('[data-v51-cur="crc"]');i.value=b.dataset.v51Crc;v51FxCalc('crc')});
  document.querySelectorAll('[data-v51-usd]').forEach(b=>b.onclick=()=>{const i=document.querySelector('[data-v51-cur="usd"]');i.value=b.dataset.v51Usd;v51FxCalc('usd')});
  if(document.querySelector('[data-v51-cur="eur"]'))v51FxCalc('eur');
  const rs=document.getElementById('v51rsave');if(rs)rs.onclick=()=>{const a=parseFloat(document.getElementById('v51r1').value),b=parseFloat(document.getElementById('v51r2').value);if(a>0&&b>0){state.v51Rates={eurusd:a,usdcrc:b,date:'eigen koers '+new Date().toLocaleDateString('nl-NL')};save();render()}};
  const ex=document.getElementById('export');if(ex){const f=ex.onclick;ex.onclick=()=>{state.v51LastBackup=new Date().toISOString();save();f&&f();setTimeout(render,300)}}
};

render();
</script>

<script>

/* ================= v5.2 – stabilisatie: duidelijke labels, back-upcontrole, snelle waarneming ================= */
/* kaartlabels */
v51Legend=function(){return `<div class="v51-legend"><span><i class="l-road"></i>Weg (schematisch)</span><span><i class="l-boat"></i>Boot</span><span><i class="l-exc"></i>Excursie</span><span><i class="l-me"></i>Jij</span></div><p class="v52-note">${v50I('info',14)}Schematische routekaart: rechte lijnen tussen bestemmingen, geen wegen. Navigeren doe je via Google Maps of Waze (vraagt internet).</p>`};
v51GpsBox=function(){const s=v51Watch!==null;return `<div class="v51-gps"><button id="v51gps" class="${s?'on':''}">${v50I('pin',16)}${s?'Live positie aan':'Toon mijn positie'}</button><span id="v51gpsinfo">${v51Pos?`${v51Pos.lat.toFixed(4)}, ${v51Pos.lon.toFixed(4)} · ±${Math.round(v51Pos.acc)} m`:'GPS, werkt zonder internet'}</span></div><p class="v52-gpsnote">Alleen terwijl de app open is en het scherm aan staat. Bij vergrendelen of wisselen van app stopt de browser met updaten.</p>`};

/* valuta: koers expliciet indicatief */
function v52RateAge(){const r=state.v51Rates;if(r.savedAt)return Math.floor((Date.now()-new Date(r.savedAt))/864e5);return Math.floor((Date.now()-new Date('2026-10-12T12:00:00'))/864e5)}
const v52PrevFx=v51Fx;
v51Fx=function(){const a=v52RateAge();return v52PrevFx().replace('<div class="v51-fxrow">',`<div class="v52-rate ${a>30?'old':''}">${v50I(a>30?'alert':'info',15)}<span>Indicatieve koers van ${esc(state.v51Rates.date)} (${a===0?'vandaag':a+' dagen oud'}). Geen live bank- of wisselkantoorprijs; ter plaatse rekenen pinautomaten en winkels hun eigen koers.</span></div><div class="v51-fxrow">`)};

/* back-up: downloaden + controleren */
function v52BackupCard(){const a=v51BackupAge(),v=state.v52Verified,warn=a===null||a>14;
  return `<div class="card v51-backup ${warn?'warn':''}">${v50I(warn?'alert':'check',20)}<div style="flex:1"><b>${a===null?'Nog geen back-up gedownload':a===0?'Back-up gedownload: vandaag':`Laatste download: ${a} ${a===1?'dag':'dagen'} geleden`}</b>
  <span>${v?`Laatst gecontroleerd: ${new Date(v.at).toLocaleDateString('nl-NL')} · ${v.summary}`:'Nog geen back-upbestand gecontroleerd. Een download bewijst niet dat het bestand goed is opgeslagen.'}</span>
  <label class="v52-verify">${v50I('check',15)}Controleer back-upbestand<input type="file" id="v52verify" accept="application/json,.json"></label><div id="v52vres"></div></div></div>`}
function v52Count(s){const obs=Object.values(s.v43Observations||{}).filter(o=>Object.values(o.places||{}).some(p=>p.seen||p.photo)).length;
  return {notes:Object.values(s.notes||{}).filter(Boolean).length,obs,pack:Object.values(s.v48Pack||{}).filter(Boolean).length,booked:Object.values(s.bookings||{}).filter(x=>x==='geboekt').length,tracks:(s.gpsTracks||[]).length,logs:Object.values(s.v44Log||{}).reduce((n,p)=>n+Object.values(p).filter(r=>r.note).length,0)}}
function v52Verify(file){const out=document.getElementById('v52vres');const rd=new FileReader();
  rd.onload=()=>{let j;try{j=JSON.parse(rd.result)}catch(e){out.innerHTML='<p class="v52-bad">Dit is geen leesbaar JSON-bestand.</p>';return}
    if(!j||j.format!=='CR27_V2'||typeof j.state!=='object'){out.innerHTML='<p class="v52-bad">Geen geldige Costa Rica 2027-back-up (formaat ontbreekt).</p>';return}
    const f=v52Count(j.state),c=v52Count(state),keys=[['notes','dagnotities'],['obs','soorten geregistreerd'],['logs','waarnemingsnotities'],['pack','paklijst afgevinkt'],['booked','geboekt'],['tracks','GPS-routes']];
    const rows=keys.map(([k,l])=>`<tr><td>${l}</td><td>${f[k]}</td><td>${c[k]}</td><td>${f[k]>=c[k]?'✓':'<b>ouder</b>'}</td></tr>`).join('');
    const ok=keys.every(([k])=>f[k]>=c[k]);
    out.innerHTML=`<p class="${ok?'v52-good':'v52-bad'}">${ok?'Back-up is leesbaar en compleet ten opzichte van de app.':'Back-up is leesbaar, maar ouder dan je huidige gegevens. Download een nieuwe.'} Gemaakt: ${j.exportedAt?new Date(j.exportedAt).toLocaleString('nl-NL'):'onbekend'}.</p><table class="v52-tbl"><tr><th></th><th>Bestand</th><th>App</th><th></th></tr>${rows}</table><p class="hint">Er is niets overschreven.</p>`;
    state.v52Verified={at:new Date().toISOString(),summary:ok?'compleet':'ouder dan de app'};save()};
  rd.readAsText(file)}
renderSettings=function(){return v52BackupCard()+v51Fx()+v51PrevSettings()};

/* snelle waarneming vanaf het dagoverzicht */
function v52QuickOpen(){const d=S[currentDay-1],{region,base,extras}=v47RegionNames(d),focus=(V47_FOCUS[d.id]||{}).list||[];
  const list=[...new Set([...focus,...base,...extras])];
  const ov=document.createElement('div');ov.className='detail-overlay';ov.id='v52quick';
  ov.innerHTML=`<section class="detail-sheet v52-sheet" role="dialog" aria-modal="true" aria-label="Waarneming registreren"><div class="v52-sheethead"><b>Waarneming · ${esc(region)}</b><button id="v52close" aria-label="Sluiten">✕</button></div>
  <div class="v50-search"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="v52q" type="search" placeholder="Zoek soort (NL of Engels)" autocomplete="off"></div>
  <div id="v52list">${list.map(n=>v52Row(n,region)).join('')}</div>
  <div class="v52-new" id="v52new" hidden><span>Niet gevonden?</span><button id="v52add">+ Voeg "<i></i>" toe en markeer als gezien</button></div></section>`;
  document.body.append(ov);
  const q=ov.querySelector('#v52q');q.focus();
  q.oninput=()=>{const v=q.value.trim().toLowerCase();let n=0;ov.querySelectorAll('.v52-row').forEach(r=>{const ok=!v||r.dataset.s.includes(v);r.style.display=ok?'':'none';if(ok)n++});const nw=ov.querySelector('#v52new');nw.hidden=!(v.length>1&&n===0);nw.querySelector('i').textContent=q.value.trim()};
  ov.querySelector('#v52add').onclick=()=>{const name=q.value.trim();if(!name)return;state.v43Extras[region]??=[];if(!state.v43Extras[region].some(x=>v43name(x)===v43name(name)))state.v43Extras[region].push(name);v52Set(name,region,'seen',true);ov.remove();render()};
  ov.querySelector('#v52close').onclick=()=>{ov.remove();render()};ov.onclick=e=>{if(e.target===ov){ov.remove();render()}};
  ov.querySelectorAll('[data-v52]').forEach(b=>b.onclick=()=>{const [kind,enc]=b.dataset.v52.split('|'),name=decodeURIComponent(enc),rec=v52Set(name,region,kind);const row=b.closest('.v52-row');row.querySelector('[data-v52^="seen"]').classList.toggle('on',rec.seen);row.querySelector('[data-v52^="photo"]').classList.toggle('on',rec.photo)});
}
function v52Row(n,region){const i=v47Info(n),h=v47Obs(n,region).here;return `<div class="v52-row" data-s="${esc((i.nl+' '+i.en).toLowerCase())}"><div><b>${esc(i.nl)}</b>${i.nl!==i.en?`<small>${esc(i.en)}</small>`:''}</div><button data-v52="seen|${encodeURIComponent(n)}" class="${h.seen?'on':''}">Gezien</button><button data-v52="photo|${encodeURIComponent(n)}" class="${h.photo?'on':''}">Foto</button></div>`}
function v52Set(name,place,kind,force){const id=v43name(name);state.v43Observations[id]??={name,places:{}};const o=state.v43Observations[id];o.places[place]??={seen:false,photo:false};const r=o.places[place];
  if(kind==='photo'){r.photo=force??!r.photo;if(r.photo)r.seen=true}else{r.seen=force??!r.seen;if(!r.seen)r.photo=false}save();return r}
const v52PrevDC=dayContent;
dayContent=function(d){const h=v52PrevDC(d);if(daySection!=='overview')return h;const {region}=v47RegionNames(d),n=Object.values(state.v43Observations).filter(o=>o.places?.[region]?.seen).length;
  return h.replace('<button class="v50-stay"',`<button class="v52-quickbtn" id="v52open">${V46_SVG(V46_ICONS.binoculars).replace('width="24" height="24"','width="20" height="20"')}<span><b>Waarneming registreren</b><small>${n?n+' soorten gezien in '+esc(region):'Gezien of gefotografeerd? Eén tik.'}</small></span>${v50I('plus',18)}</button><button class="v50-stay"`)};
const v52PrevBind=bindExtras;
bindExtras=function(){v52PrevBind();const o=document.getElementById('v52open');if(o)o.onclick=v52QuickOpen;const v=document.getElementById('v52verify');if(v)v.onchange=()=>v.files[0]&&v52Verify(v.files[0]);
  const rs=document.getElementById('v51rsave');if(rs){const f=rs.onclick;rs.onclick=()=>{f&&f();state.v51Rates.savedAt=new Date().toISOString();save();render()}}};

render();
</script>
<style id="v53">
.v53-tl-img{width:52px;height:52px;border-radius:13px;overflow:hidden;flex:none;position:relative;z-index:1;display:grid;place-items:center;box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px var(--k,#cfe6d3)}
.v53-tl-img.k-saw{--k:#7cc98f;background:#e3f4e4}.v53-tl-img.k-own{--k:#f2b072;background:#fdeedd}.v53-tl-img.k-opt{--k:#8db3e6;background:#e3edfb}
.v53-tl-img img{width:100%;height:100%;object-fit:cover;display:block}
.v50-tl.v53-tl:not(:last-child):after{left:25px;top:60px}
.v53-hrow{margin:0 0 14px}
.v53-hdays{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#5f7568;margin:0 4px 6px}
.v53-hlist .v48-hotel{margin:0}
</style>
<script>

/* ================= v5.3 – hotels: één per plek (Sawadee-lijst leidend), foto's i.p.v. iconen ================= */
/* CENTRALE HOTELLIJST — hier de definitieve Sawadee-lijst invullen vlak voor vertrek */
const V53_HOTELS={
 'San José':'Fleur de Lys',
 'Cahuita':'Atlantida Lodge',
 'Tortuguero':'Lapa Verde Lodge',
 'La Fortuna':'Catarata Ecolodge',
 'Rincón de la Vieja':'Cañon de la Vieja Lodge',
 'Monteverde':'Hotel Los Cipreses',
 'San Gerardo de Dota':'Sueños del Bosque',
 'Vergel de Punta Mala / Uvita':'Rio Tico Safari Lodge',
 'Corcovado':'Cabinas Las Palmeras',
 'Esterillos':'Hotel Playa Bejuco'
};
const V53_DEFINITIEF=false; /* op true zetten zodra de definitieve lijst is verwerkt */
(function(){
  H.forEach(e=>{const pick=V53_HOTELS[e[0]];if(pick)e[1]=[pick]});
  S.forEach(d=>{if(!d.hotel.length)return;const k=V53_REGION_OF(d);if(V53_HOTELS[k])d.hotel=[V53_HOTELS[k]]});
})();
function V53_REGION_OF(d){const p=d.place.toLowerCase();if(p.includes('vergel')||p.includes('uvita'))return 'Vergel de Punta Mala / Uvita';if(p.includes('corcovado'))return 'Corcovado';if(p.includes('manuel'))return 'Esterillos';for(const k of Object.keys(V53_HOTELS))if(p.includes(k.toLowerCase()))return k;return v43place(d.place)}
const V53_STATUS=()=>V53_DEFINITIEF?'Definitief volgens Sawadee':'Voorlopig: eerste hotel van de Sawadee-lijst · definitief volgt vlak voor vertrek';

/* hotelkaart: label */
const v53PrevHotelCard=v48HotelCard;
v48HotelCard=function(h,d,n){return v53PrevHotelCard(h,d,1).replace(/<small>(Standaard voor 2 personen|Alleen voor singlereizigers|Een van de Sawadee-opties|Sawadee-accommodatie)<\/small>/,`<small>${V53_STATUS()}</small>`)};
function v48HotelsBlock(d){return d.hotel.length?d.hotel.map(h=>v48HotelCard(h,d,1)).join(''):'<p class="hint">Geen overnachting gepland.</p>'}

/* tijdlijn met foto's */
v50Timeline=function(d){
  const order={Ochtend:0,Middag:2,Avond:3};
  const acts=d.activities.map((a,i)=>({a,i})).filter(x=>x.a.status!=='excluded').sort((x,y)=>(order[V50_SLOT[x.a.title]]??1)-(order[V50_SLOT[y.a.title]]??1)||x.i-y.i);
  return acts.map(({a,i})=>{const k=v50Kind(a),info=V48_ACT[a.title]||{},slot=V50_SLOT[a.title],src=v48Photo(v48ActKey(a,d));
    const sub=[info.dur,info.price].filter(Boolean).join(' · ')||a.note||'';
    return `<div class="v50-tl v53-tl" data-activity="${i}" data-day="${d.id}" role="button" tabindex="0">
      <div class="v53-tl-img ${V50_KIND[k][1]}">${src?`<img src="${src}" alt="" loading="lazy">`:v46Icon(v46IconKey(a.title),18)}</div>
      <div class="v50-tl-body">${slot?`<small>${slot}</small>`:''}<b>${esc(a.title)}</b>${sub?`<span>${esc(sub)}</span>`:''}</div>
      <span class="v50-pill ${V50_KIND[k][1]}">${V50_KIND[k][0]}</span></div>`}).join('')||'<p class="hint">Geen activiteiten op deze dag.</p>'};

/* dag-tab Hotel: tekst */
const v53PrevDC=dayContent;
dayContent=function(d){let h=v53PrevDC(d);if(daySection==='stay')h=h.replace(/<p class="hint" style="padding:0 4px">[^<]*<\/p>/,`<p class="hint" style="padding:0 4px">${V53_STATUS()}.</p>`);return h};

/* Hotels-scherm met fotokaarten */
renderHotels=function(){
  const rows=H.map(([region,list])=>{const days=S.filter(d=>d.hotel.includes(list[0])).map(d=>d.id),d0=S[(days[0]||1)-1];if(!list[0])return '';
    return `<div class="v53-hrow"><div class="v53-hdays">Dag ${days.every((x,i)=>!i||x===days[i-1]+1)&&days.length>1?days[0]+'–'+days[days.length-1]:days.join(' en ')} · ${days.length} ${days.length===1?'nacht':'nachten'} · ${esc(region)}</div>${v48HotelCard(list[0],d0,1)}</div>`}).join('');
  return `<div class="card"><div class="v50-h">Accommodaties</div><p class="hint" style="margin:0">${V53_STATUS()}. Foto's zijn sfeerbeelden van een vergelijkbare plek, niet van het hotel zelf.</p></div><div class="v50-hotels v53-hlist">${rows}</div>`};
Object.assign(V48_PHOTO,{"act-cacao": {"title": "File:Cacao fruit in Côte d'Ivoire (11).JPG", "credit": "Hanay", "license": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:Cacao_fruit_in_C%C3%B4te_d%27Ivoire_(11).JPG", "sfeer": true}, "act-oropendola": {"title": "File:Waterfall.Llanos de Cortes. Cañas. Costa Rica.JPG", "credit": "Rodtico21", "license": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File:Waterfall.Llanos_de_Cortes._Ca%C3%B1as._Costa_Rica.JPG", "sfeer": true}, "act-coyotes": {"title": "File:Rio Celeste Costa Rica 01.jpg", "credit": "Julián Monge-Nájera", "license": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:Rio_Celeste_Costa_Rica_01.jpg", "sfeer": true}, "act-tattoo": {"title": "File:Italian-tattoo-artist-at-work.jpg", "credit": "Technopop.tattoo", "license": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:Italian-tattoo-artist-at-work.jpg", "sfeer": true}});
Object.assign(V48_ACT_PHOTO,{"Bri Bri-gemeenschap, cacao en traditionele lunch": "act-cacao", "Oropéndola-waterval": "act-oropendola", "Poza Los Coyotes": "act-coyotes", "Tatoeage in Monteverde": "act-tattoo"});
['act-coffee','act-coconut','act-guanacaste','act-horse','act-jungle-frog','act-nightwalk','act-sjo'].forEach(k=>{if(V48_PHOTO[k])V48_PHOTO[k].sfeer=true});
const v53PrevOpen=openActivity;
openActivity=function(day,idx){v53PrevOpen(day,idx);const d=S[day-1],a=d.activities[idx],k=v48ActKey(a,d),cap=document.querySelector('#detailOverlay figcaption');if(cap&&V48_PHOTO[k]?.sfeer)cap.textContent='Sfeerbeeld · '+cap.textContent};

render();
</script>
</body></html>

function renderDays(){let days=S.filter(d=>(sourceFilter==='all'||d.activities.some(a=>a.source===sourceFilter))&&(!query||[d.place,d.base,...d.activities.map(a=>a.title),...d.wildlife].join(' ').toLowerCase().includes(query.toLowerCase())));return `<div class="grid"><div class="metric"><strong>23</strong><span>Kalenderdagen</span></div><div class="metric"><strong>${activities.filter(a=>a.status==='locked').length}</strong><span>Vastgezette activiteiten</span></div><div class="metric"><strong>${activities.filter(a=>a.status==='optional'||a.status==='conditional').length}</strong><span>Flexibele opties</span></div></div><div class="info" style="margin-top:12px">🔵 <b>Sawadee</b> = onderdeel van groepsreis of door Sawadee aangeboden optie (niet per se inbegrepen). 🟢 <b>Zelf toegevoegd</b> = onze eigen activiteit. 🔒 = planningslock, <b>geen boekingsbevestiging</b>.</div><div class="toolbar"><input id="search" placeholder="Zoek dag, locatie, vogel, activiteit…" value="${esc(query)}"><select id="source"><option value="all" ${sourceFilter==='all'?'selected':''}>Alle activiteiten</option><option value="sawadee" ${sourceFilter==='sawadee'?'selected':''}>Sawadee</option><option value="extra" ${sourceFilter==='extra'?'selected':''}>Zelf toegevoegd</option></select></div>${days.map(d=>`<article class="card"><div class="daytop"><div><div class="sub">Dag ${d.id} · ${fmt(d.date)}</div><h2>${esc(d.place)}</h2></div>${pill(d.activities.some(a=>a.status==='locked')?'🔒 Planning vast':'Sawadee-route',d.activities.some(a=>a.status==='locked')?'locked':'sawadee')}</div><p class="muted">${esc(d.base)}</p><div class="sectionlabel">Programma & opties</div>${d.activities.filter(a=>sourceFilter==='all'||a.source===sourceFilter).map(activity).join('')}${d.hotel.length?`<div class="sectionlabel">Voorlopig verblijf</div><div class="chips">${d.hotel.map(h=>'<span class="chip">🏡 '+esc(h)+'</span>').join('')}</div>`:''}${d.wildlife.length?`<div class="sectionlabel">Wildlife-doelen</div><div class="chips">${d.wildlife.map(w=>'<span class="chip">🐦 '+esc(w)+'</span>').join('')}</div>`:''}${d.tip?`<p class="hint">📸 ${esc(d.tip)}</p>`:''}${d.flag?`<div class="warning">⚠️ ${esc(d.flag)}</div>`:''}<div class="sectionlabel">Eigen notities (automatisch opgeslagen)</div><textarea class="field" data-note="${d.id}" placeholder="Tijd, ontmoetingspunt, waarnemingen, foto-ideeën…">${esc(state.notes[d.id]||'')}</textarea></article>`).join('')||'<div class="card">Geen resultaten gevonden.</div>'}`}
function renderBookings(){let completed=bookingActs.filter(a=>state.bookings[a.id]==='geboekt').length;return `<div class="card"><h2>Excursies & boekingsstatus</h2><p class="hint">Een LOCK betekent dat we de activiteit willen doen. Kies pas <b>Geboekt</b> nadat de aanbieder de reservering heeft bevestigd.</p><div class="row"><strong>${completed} / ${bookingActs.length} geboekt</strong>${pill('Route blijft LOCKED','locked')}</div><div class="progress" style="margin-top:9px"><div style="width:${100*completed/bookingActs.length}%"></div></div></div><div class="toolbar"><select id="bookfilter"><option value="all">Alle bronnen</option><option value="sawadee">Alleen Sawadee</option><option value="extra">Alleen eigen toevoegingen</option></select></div><div id="bookingList">${bookingActs.map(a=>`<article class="card booking" data-source="${a.source}"><div class="row"><strong>${esc(a.title)}</strong>${pill(sourceName[a.source],a.source)}</div><div class="sub" style="margin:5px 0">Dag ${a.day} · ${fmt(a.date)} · ${esc(a.place)}</div>${pill(statusName[a.status],a.status)}${a.note?`<p class="hint">${esc(a.note)}</p>`:''}<label class="sectionlabel" style="display:block">Werkelijke boekingsstatus</label><select class="field" data-book="${a.id}"><option value="open" ${(state.bookings[a.id]||'open')==='open'?'selected':''}>Nog niet geboekt / controleren</option><option value="aangevraagd" ${state.bookings[a.id]==='aangevraagd'?'selected':''}>Aangevraagd</option><option value="geboekt" ${state.bookings[a.id]==='geboekt'?'selected':''}>Geboekt / bevestigd</option><option value="terplekke" ${state.bookings[a.id]==='terplekke'?'selected':''}>Ter plaatse regelen</option><option value="nvt" ${state.bookings[a.id]==='nvt'?'selected':''}>Geen boeking nodig</option></select></article>`).join('')}</div>`}
function renderHotels(){return `<div class="card"><h2>Voorlopige accommodaties 🔒</h2><p class="hint">Deze <b>lijst met alternatieven</b> is LOCKED, niet de definitieve toewijzing. Sawadee verstrekt de definitieve hotels enkele weken voor vertrek. Je kunt dan hieronder per regio het gekozen hotel selecteren.</p></div>${H.map(([place,opts],i)=>`<article class="card"><h3>${esc(place)}</h3><div class="chips">${opts.map(x=>'<span class="chip">🏡 '+esc(x)+'</span>').join('')}</div><label class="sectionlabel" style="display:block">Definitieve accommodatie (later invullen)</label><select class="field" data-hotel="${i}"><option value="">Nog niet toegewezen</option>${opts.map(x=>`<option value="${esc(x)}" ${state.hotelSelected[i]===x?'selected':''}>${esc(x)}</option>`).join('')}</select></article>`).join('')}`}
function renderWildlife(){return `<div class="card"><h2>Wildlife & fotografie 📸</h2><p class="hint">Doelsoorten zijn kansen, geen gegarandeerde waarnemingen. Gebruik Merlin Bird ID en je veldgids; noteer observaties bij de betreffende dag.</p></div>${S.filter(d=>d.wildlife.length).map(d=>`<div class="card"><div class="sub">Dag ${d.id} · ${fmt(d.date)}</div><h3>${esc(d.place)}</h3><div class="chips">${d.wildlife.map(w=>'<span class="chip">'+esc(w)+'</span>').join('')}</div>${d.tip?`<p class="hint">${esc(d.tip)}</p>`:''}</div>`).join('')}`}
function renderBudget(){let total=Object.values(state.costs).reduce((s,v)=>s+(Number(v)||0),0);return `<div class="card"><h2>Budgettracker 💶</h2><p class="hint">De LOCKED reserve is <b>€900 per persoon / €1.800 voor twee</b>. Vul hieronder zelf <b>werkelijk bekende eurobedragen</b> in. Lege velden zijn onbekend, niet €0. Geen automatische USD-omrekening of verzonnen tarieven.</p><div class="grid"><div class="metric"><strong>€900</strong><span>Reserve p.p.</span></div><div class="metric"><strong>€1.800</strong><span>Reserve voor 2</span></div><div class="metric"><strong>€${total.toLocaleString('nl-NL')}</strong><span>Ingevuld totaal (€)</span></div></div></div>${bookingActs.map(a=>`<div class="card row"><div style="flex:1;min-width:180px"><strong>${esc(a.title)}</strong><div class="sub">${esc(sourceName[a.source])} · ${fmt(a.date)}</div></div><label class="smalltext">Totaal €<input class="field costinput" type="number" min="0" step="0.01" data-cost="${a.id}" value="${esc(state.costs[a.id]??'')}" placeholder="onbekend"></label></div>`).join('')}<p class="hint">Tatoeage, eventuele transfers, fooien en lokale bijkomende kosten apart controleren. Ingevoerde bedragen zijn <b>totale bedragen</b> (niet per persoon).</p>`}
function renderSettings(){return `<div class="card"><h2>Back-up & herstel</h2><p class="hint">Je notities, hotelkeuzes, boekingsstatus en kosten worden <b>lokaal in deze browser</b> opgeslagen. Bij een andere telefoon of browser worden ze niet automatisch gesynchroniseerd. Maak daarom regelmatig een JSON-back-up.</p><div class="actionbuttons"><button class="btn primary" id="export">⬇️ Download back-up</button><label class="btn" for="import">⬆️ Importeer back-up</label><input id="import" type="file" accept="application/json,.json" class="hidden"></div><p class="hint">Bij een toekomstige nieuwe appversie kun je deze back-up opnieuw importeren. De route en activiteiten zitten in de app zelf; eigen gegevens staan in de back-up.</p></div><div class="card"><h2>Wat betekent de herkomst?</h2><p>${pill('Sawadee','sawadee')} Activiteit of transfer uit het officiële groepsreisprogramma, óf een optionele excursie die Sawadee noemt. <b>Dit betekent niet automatisch inbegrepen of gereserveerd.</b></p><p>${pill('Zelf toegevoegd','extra')} Onze aanvullingen, zoals extra vogelgidsen, whale watching en snorkelen.</p><p>${pill('🔒 Vastgezet','locked')} Planningsbesluit; niet hetzelfde als een reservering.</p><p>${pill('Als tijd over','optional')} Bewust flexibel, geen verplicht onderdeel.</p><p>${pill('Voorwaardelijk','conditional')} Alleen als groepsschema, weer of omstandigheden dit toelaten.</p><p class="hint">Tijden die alleen ter plekke beoordeeld kunnen worden blijven bewust open. De LOCKED route wordt niet automatisch gewijzigd.</p><p><a href="${DATA.meta.sourceUrl}" target="_blank" rel="noopener noreferrer">Officiële uitgebreide Sawadee-reisroute ↗</a></p></div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#app').innerHTML=({days:renderDays,bookings:renderBookings,hotels:renderHotels,wildlife:renderWildlife,budget:renderBudget,settings:renderSettings})[tab]();bind()}
function bind(){document.querySelectorAll('[data-note]').forEach(el=>el.addEventListener('input',()=>{state.notes[el.dataset.note]=el.value;save()}));document.querySelectorAll('[data-book]').forEach(el=>el.addEventListener('change',()=>{state.bookings[el.dataset.book]=el.value;save()}));document.querySelectorAll('[data-hotel]').forEach(el=>el.addEventListener('change',()=>{state.hotelSelected[el.dataset.hotel]=el.value;save()}));document.querySelectorAll('[data-cost]').forEach(el=>el.addEventListener('change',()=>{state.costs[el.dataset.cost]=el.value;save();render()}));if($('#search')){$('#search').addEventListener('change',e=>{query=e.target.value;render()});$('#source').addEventListener('change',e=>{sourceFilter=e.target.value;render()})}if($('#bookfilter'))$('#bookfilter').addEventListener('change',e=>document.querySelectorAll('.booking').forEach(x=>x.style.display=e.target.value==='all'||x.dataset.source===e.target.value?'':'none'));if($('#export'))$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({format:'CR27_V2',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Costa_Rica_2027_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};if($('#import'))$('#import').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(v.format!=='CR27_V2'||!v.state||typeof v.state!=='object')throw Error('Onjuist back-upformaat');if(!confirm('Bestaande notities en boekingsstatus vervangen door back-up?'))return;state=v.state;state.notes??={};state.bookings??={};state.costs??={};state.hotelSelected??={};save();render();alert('Back-up geïmporteerd.')}catch(err){alert('Back-up kon niet worden ingelezen: '+err.message)}})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo({top:0,behavior:'instant'})});render();
</script><script>if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.warn)); }</script></body></html>

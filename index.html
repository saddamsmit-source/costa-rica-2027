function renderSettings(){return `<div class="card"><h2>Back-up & herstel</h2><p class="hint">Je notities, hotelkeuzes, boekingsstatus en kosten worden <b>lokaal in deze browser</b> opgeslagen. Bij een andere telefoon of browser worden ze niet automatisch gesynchroniseerd. Maak daarom regelmatig een JSON-back-up.</p><div class="actionbuttons"><button class="btn primary" id="export">⬇️ Download back-up</button><label class="btn" for="import">⬆️ Importeer back-up</label><input id="import" type="file" accept="application/json,.json" class="hidden"></div><p class="hint">Bij een toekomstige nieuwe appversie kun je deze back-up opnieuw importeren. De route en activiteiten zitten in de app zelf; eigen gegevens staan in de back-up.</p></div><div class="card"><h2>Wat betekent de herkomst?</h2><p>${pill('Sawadee','sawadee')} Activiteit of transfer uit het officiële groepsreisprogramma, óf een optionele excursie die Sawadee noemt. <b>Dit betekent niet automatisch inbegrepen of gereserveerd.</b></p><p>${pill('Zelf toegevoegd','extra')} Onze aanvullingen, zoals extra vogelgidsen, whale watching en snorkelen.</p><p>${pill('🔒 Vastgezet','locked')} Planningsbesluit; niet hetzelfde als een reservering.</p><p>${pill('Als tijd over','optional')} Bewust flexibel, geen verplicht onderdeel.</p><p>${pill('Voorwaardelijk','conditional')} Alleen als groepsschema, weer of omstandigheden dit toelaten.</p><p class="hint">Tijden die alleen ter plekke beoordeeld kunnen worden blijven bewust open. De LOCKED route wordt niet automatisch gewijzigd.</p><p><a href="${DATA.meta.sourceUrl}" target="_blank" rel="noopener noreferrer">Officiële uitgebreide Sawadee-reisroute ↗</a></p></div>`}

const DAY_HERO=["hero-home.jpg", "hero-jungle.jpg", "hero-jungle.jpg", "hero-jungle.jpg", "hero-jungle.jpg", "hero-day.jpg", "hero-day.jpg", "hero-day.jpg", "hero-day.jpg", "hero-jungle.jpg", "hero-jungle.jpg", "hero-jungle.jpg", "hero-jungle.jpg", "hero-jungle.jpg", "hero-map.jpg", "hero-map.jpg", "hero-jungle.jpg", "hero-jungle.jpg", "hero-jungle.jpg", "hero-map.jpg", "hero-jungle.jpg", "hero-map.jpg", "hero-home.jpg"];

function wildlifeStats(){const seen=Object.keys(state.speciesSeen).filter(k=>state.speciesSeen[k]).length,photo=Object.keys(state.speciesPhoto).filter(k=>state.speciesPhoto[k]).length;return {seen,photo};}
function speciesList(d){const list=speciesFor(d),st=wildlifeStats();return `<div class="card"><div class="panel-title">🦜 Must-see wildlife & vogels</div><p class="hint">Vink af wat je hebt gezien of gefotografeerd. Zelf toegevoegde soorten worden per bestemming opgeslagen. Waarnemingen zijn niet gegarandeerd.</p><div class="tracker-metric"><span>👀 ${st.seen} gezien</span><span>📷 ${st.photo} gefotografeerd</span><span>🎯 ${list.length} doelsoorten hier</span></div>${list.map((w,i)=>{let key=encodeURIComponent(d.place+'|'+w), seen=!!state.speciesSeen[decodeURIComponent(key)],photo=!!state.speciesPhoto[decodeURIComponent(key)];return `<div class="species-card"><div class="species-main"><strong>${esc(w)}</strong><small>${esc(d.place)}</small></div><div class="species-actions"><button data-species="${key}" data-kind="seen" class="${seen?'on':''}">${seen?'✓ ':''}Gezien</button><button data-species="${key}" data-kind="photo" class="photo ${photo?'on':''}">${photo?'✓ ':''}Foto</button></div></div>`}).join('')}<div class="species-add"><input id="newSpecies" maxlength="90" placeholder="Voeg een dier of vogel toe" aria-label="Nieuwe doelsoort"><button id="addSpecies">+ Voeg toe</button></div></div>${d.tip?`<div class="card"><div class="panel-title">📷 Fotografietip</div><p>${esc(d.tip)}</p></div>`:''}`}
function detailsText(a,d){let title=a.title.toLowerCase();let photography=d.tip||'Gebruik je 200–600 mm voor vogels en zoogdieren; neem ook je 24–105 mm mee voor omgeving en dichtbij.';let advice=title.includes('boot')||title.includes('kano')||title.includes('snorkel')||title.includes('whale')?'Bescherm je camera tegen water en zout; gebruik een drybag en wissel geen lens op een open boot.':title.includes('quetzal')||title.includes('curi')||title.includes('vogel')?'Plan zoveel mogelijk vroeg op de ochtend, werk met rustige bewegingen en let op achtergrond en licht.':photography;return {photography:advice,planning:a.note||'De precieze starttijd en duur zijn nog niet bevestigd. Stem dit af met Sawadee of de lokale aanbieder.',wildlife:(d.wildlife||[]).slice(0,6).join(' · ')||'Wildlife verschilt per locatie en seizoen; geen waarnemingen gegarandeerd.'}}
function openActivity(day,idx){const d=S[day-1],a=d.activities[idx],meta=detailsText(a,d),id=day+'-'+idx;let overlay=document.createElement('div');overlay.className='detail-overlay';overlay.id='detailOverlay';overlay.innerHTML=`<section class="detail-sheet" role="dialog" aria-modal="true" aria-label="Activiteitdetails"><button class="details-close" id="closeDetail">← Terug naar dag</button><div class="detail-meta" style="margin-top:14px">${pill(sourceName[a.source],a.source)} ${pill(statusName[a.status],a.status)}</div><h2>${esc(a.title)}</h2><p class="hint">Dag ${d.id} · ${fmt(d.date)} · ${esc(d.place)}</p><h3>🗓 Planning & praktische uitvoering</h3><p>${esc(meta.planning)}</p><h3>🦜 Mogelijke wildlife-doelsoorten</h3><p>${esc(meta.wildlife)}</p><h3>📷 Fotografieadvies</h3><p>${esc(meta.photography)}</p><h3>📌 Boekingsstatus</h3><p class="hint">Een LOCKED planningsbesluit betekent niet dat de activiteit geboekt is.</p><select id="detailBooking"><option value="open">Nog te regelen / onbekend</option><option value="aangevraagd">Aangevraagd</option><option value="geboekt">Bevestigd / geboekt</option><option value="on-site">Ter plaatse regelen</option><option value="nvt">Niet van toepassing</option></select><p class="gps-warning">De informatie is gebaseerd op onze planning; tijden en wildlife zijn geen live bevestigingen.</p></section>`;document.body.append(overlay);document.getElementById('detailBooking').value=state.bookings[id]||'open';document.getElementById('detailBooking').onchange=e=>{state.bookings[id]=e.target.value;save()};document.getElementById('closeDetail').onclick=()=>overlay.remove();overlay.onclick=e=>{if(e.target===overlay)overlay.remove()}}
function bindExtras(){document.querySelectorAll('[data-activity]').forEach(el=>el.onclick=()=>openActivity(Number(el.dataset.day),Number(el.dataset.activity)));document.querySelectorAll('[data-species]').forEach(el=>el.onclick=()=>{let k=decodeURIComponent(el.dataset.species),kind=el.dataset.kind;if(kind==='photo'){state.speciesPhoto[k]=!state.speciesPhoto[k];if(state.speciesPhoto[k])state.speciesSeen[k]=true}else{state.speciesSeen[k]=!state.speciesSeen[k];if(!state.speciesSeen[k])state.speciesPhoto[k]=false}save();render()});let add=document.getElementById('addSpecies');if(add)add.onclick=()=>{let input=document.getElementById('newSpecies'),w=input.value.trim(),d=S[currentDay-1];if(!w)return;if(w.length>90)return;state.customSpecies[d.place]??=[];if(!speciesFor(d).some(s=>s.toLowerCase()===w.toLowerCase()))state.customSpecies[d.place].push(w);save();render()};let gps=document.getElementById('gpsStart');if(gps)gps.onclick=()=>startGps();let stop=document.getElementById('gpsStop');if(stop)stop.onclick=()=>stopGps();let exportG=document.getElementById('gpsExport');if(exportG)exportG.onclick=()=>exportGps();}
let gpsWatch=null,gpsPoints=[];
function startGps(){if(!navigator.geolocation){alert('GPS niet beschikbaar in deze browser');return}if(gpsWatch!==null)return;gpsPoints=[];gpsWatch=navigator.geolocation.watchPosition(p=>{let x={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy,time:new Date(p.timestamp).toISOString()};if(x.accuracy<=100&&(!gpsPoints.length||Date.parse(x.time)-Date.parse(gpsPoints.at(-1).time)>4000))gpsPoints.push(x);let status=document.getElementById('gpsStatus');if(status)status.textContent=`GPS actief · ${gpsPoints.length} meetpunten · nauwkeurigheid ±${Math.round(x.accuracy)} m`},e=>{let status=document.getElementById('gpsStatus');if(status)status.textContent='GPS-fout: '+e.message},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});let status=document.getElementById('gpsStatus');if(status)status.textContent='GPS toestemming aanvragen…'}
function stopGps(){if(gpsWatch===null)return;navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;if(gpsPoints.length){state.gpsTracks.push({day:new Date().toISOString().slice(0,10),points:gpsPoints});save()}gpsPoints=[];render()}
function exportGps(){let tracks=state.gpsTracks.flatMap(t=>t.points||[]);if(!tracks.length){alert('Nog geen opgeslagen GPS-punten');return}let xml='<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Costa Rica 2027" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Costa Rica 2027</name><trkseg>'+tracks.map(p=>`<trkpt lat="${p.lat}" lon="${p.lon}"><time>${p.time}</time></trkpt>`).join('')+'</trkseg></trk></gpx>';let blob=new Blob([xml],{type:'application/gpx+xml'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Costa_Rica_2027_route.gpx';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function gpsPanel(){return `<div class="gps-card"><h3>📍 GPS-route vastleggen (testfunctie)</h3><p>Start de registratie terwijl de app geopend is. GPS vraagt toestemming. Bij schermvergrendeling, wisselen van app of energiebesparing kan de opname stoppen. Dit is <b>geen betrouwbare achtergrondtracker</b>.</p><div id="gpsStatus" class="gps-warning">${gpsWatch===null?'GPS niet actief':`GPS actief · ${gpsPoints.length} meetpunten`}</div><button id="gpsStart">▶ Start opname</button><button id="gpsStop">■ Stop & bewaar</button><button id="gpsExport">↓ Exporteer GPX</button><p class="gps-warning">${state.gpsTracks.length} opgeslagen traject(en). Locaties blijven lokaal in je browser en in je JSON-back-up. Voor een volledige rit met vergrendeld scherm gebruik je beter een aparte GPS-tracker.</p></div>`}

function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('[data-mobile]').forEach(b=>b.classList.toggle('active',b.dataset.mobile===tab));$('#app').innerHTML=({home:renderHome,days:renderDays,map:renderMap,bookings:renderBookings,hotels:renderHotels,wildlife:renderWildlife,budget:renderBudget,settings:renderSettings})[tab]();bind()}
function bind(){bindExtras();document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{tab=b.dataset.goto;render();window.scrollTo({top:0,behavior:'instant'})});document.querySelectorAll('[data-mapplace]').forEach(b=>b.onclick=()=>window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(b.dataset.mapplace+', Costa Rica'),'_blank','noopener'));document.querySelectorAll('[data-daymove]').forEach(b=>b.onclick=()=>dayMove(Number(b.dataset.daymove)));document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>daySectionGo(b.dataset.section));if($('#dayPicker'))$('#dayPicker').onchange=e=>{currentDay=Number(e.target.value);daySection='overview';render()};const zone=$('#swipeZone');if(zone){let sx=0,sy=0;zone.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});zone.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)dayMove(dx<0?1:-1)},{passive:true})} document.querySelectorAll('[data-note]').forEach(el=>el.addEventListener('input',()=>{state.notes[el.dataset.note]=el.value;save()}));document.querySelectorAll('[data-book]').forEach(el=>el.addEventListener('change',()=>{state.bookings[el.dataset.book]=el.value;save()}));document.querySelectorAll('[data-hotel]').forEach(el=>el.addEventListener('change',()=>{state.hotelSelected[el.dataset.hotel]=el.value;save()}));document.querySelectorAll('[data-cost]').forEach(el=>el.addEventListener('change',()=>{state.costs[el.dataset.cost]=el.value;save();render()}));if($('#search')){$('#search').addEventListener('change',e=>{query=e.target.value;render()});$('#source').addEventListener('change',e=>{sourceFilter=e.target.value;render()})}if($('#bookfilter'))$('#bookfilter').addEventListener('change',e=>document.querySelectorAll('.booking').forEach(x=>x.style.display=e.target.value==='all'||x.dataset.source===e.target.value?'':'none'));if($('#export'))$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({format:'CR27_V2',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Costa_Rica_2027_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};if($('#import'))$('#import').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(v.format!=='CR27_V2'||!v.state||typeof v.state!=='object')throw Error('Onjuist back-upformaat');if(!confirm('Bestaande notities en boekingsstatus vervangen door back-up?'))return;state=v.state;state.notes??={};state.bookings??={};state.costs??={};state.hotelSelected??={};save();render();alert('Back-up geïmporteerd.')}catch(err){alert('Back-up kon niet worden ingelezen: '+err.message)}})}document.querySelectorAll('[data-tab],[data-mobile]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab||b.dataset.mobile;render();window.scrollTo({top:0,behavior:'instant'})});render();

<script>
function googleTranslateElementInit(){
    new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,es,fr',
        autoDisplay: false
    }, 'google_translate_element');

    setTimeout(function(){
        const idiomaPendiente = localStorage.getItem('atl_idioma_pendiente');

        if(idiomaPendiente){
            atlAplicarIdiomaGoogle(idiomaPendiente);
            localStorage.removeItem('atl_idioma_pendiente');
        }
    }, 1000);
}

function atlDominiosCookie(){
    const host = window.location.hostname;
    const partes = host.split('.');
    const dominios = [host, '.' + host];

    if(partes.length >= 2){
        dominios.push('.' + partes.slice(-2).join('.'));
    }

    return [...new Set(dominios)];
}

function atlBorrarGoogtrans(){
    const dominios = atlDominiosCookie();

    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/;';

    dominios.forEach(function(dominio){
        document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; domain=' + dominio + ';';
    });
}

function atlGuardarGoogtrans(lang){
    atlBorrarGoogtrans();

    if(lang !== 'en'){
        const valor = '/en/' + lang;
        const dominios = atlDominiosCookie();

        document.cookie = 'googtrans=' + valor + '; path=/;';

        dominios.forEach(function(dominio){
            document.cookie = 'googtrans=' + valor + '; path=/; domain=' + dominio + ';';
        });
    }
}

function atlAplicarIdiomaGoogle(lang){
    const select = document.querySelector('.goog-te-combo');

    if(select){
        select.value = lang;
        select.dispatchEvent(new Event('change'));
    }
}

function atlCambiarIdioma(lang){
    const etiqueta = lang.toUpperCase();

    localStorage.setItem('atl_idioma', etiqueta);
    localStorage.setItem('atl_idioma_pendiente', lang);

    const boton = document.getElementById('atlIdiomaActual');

    if(boton){
        boton.innerText = etiqueta;
    }

    atlGuardarGoogtrans(lang);

    window.location.href = window.location.pathname + window.location.search + window.location.hash;
}

document.addEventListener('DOMContentLoaded', function(){
    const idioma = localStorage.getItem('atl_idioma') || 'EN';
    const boton = document.getElementById('atlIdiomaActual');

    if(boton){
        boton.innerText = idioma;
    }
});
</script>
